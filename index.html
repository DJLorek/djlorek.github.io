<script>
        const data = {
            "homepage": '<h5 class="about_title">About</h5><div class="info"><p>Hi, I\'m DJ Lorek, an Italian DJ and electronic dance music producer set in the city of Rome since 2018.<br><br>I started making music as a hobby and then transitioned to using it to represent the world.<br><br>I love experimenting with different synths and genres, whether it\'s Melodic EDM, Techno or House Music my goal has always been the same:<br><br><span class="highlight-text">Creating something meaningful and making people dance at it.</span></p></div>',
            "musicProduction": '<h5 class="about_title">Music Production</h5><div class="info"><p>Since 2017, I have been active as a music producer, starting from a fully self-taught and experimental approach of personal exploration of style.<br><br>My studies in Goody Music DJ School provided me not only the theoretical foundations of my DJing skills but also my production ones.<br><br>Over time, I released several unofficial remixes on YouTube that reached over 10,000 views. At the same time I worked with other producers from completely different genres, which helped me building even stronger versatility as an artist.<br><br><span class="highlight-text">Today my works are a big mix of all my musical experiences, shaping a personal and recognizable sound.</span></p></div>',
            "diskJockey": '<h5 class="about_title">Disk-Jockey</h5><div class="info"><p>Between 2018 and 2020, I attended a professional DJ course at Goody Music DJ School in Rome, under the guidance of DJ Aimè.<br><br>That experience gave me a solid technical and artistic foundation, covering mixing techniques and equipment handling.<br><br>After the pandemic I began my real field experience, performing at high school events across Rome. Alongside school events, I also built experience through private events, which allowed me to perform in more intimate settings.<br><br><span class="highlight-text">One of my main strengths as a DJ is my ability to move across different musical genres, even outside of the EDM subgroup.</span></p></div>',
            "links": '<h5 class="about_title">Official Links</h5><div class="links-list"><a href="mailto:officialdjlorek@gmail.com" class="link-btn primary-btn"><i class="fa-solid fa-envelope"></i><span>Contact Me</span></a><a href="https://open.spotify.com/intl-it/artist/41vOTUUkXoGMEcbLBKVEqq" target="_blank" rel="noopener noreferrer" class="link-btn"><i class="fa-brands fa-spotify"></i><span>Spotify</span></a><a href="https://soundcloud.com/djlorek" target="_blank" rel="noopener noreferrer" class="link-btn"><i class="fa-brands fa-soundcloud"></i><span>SoundCloud</span></a><a href="https://www.instagram.com/djlorek/" target="_blank" rel="noopener noreferrer" class="link-btn"><i class="fa-brands fa-instagram"></i><span>Instagram</span></a><a href="https://www.youtube.com/@DJLorek" target="_blank" rel="noopener noreferrer" class="link-btn"><i class="fa-brands fa-youtube"></i><span>YouTube</span></a><a href="https://www.tiktok.com/@officialdjlorek" target="_blank" rel="noopener noreferrer" class="link-btn"><i class="fa-brands fa-tiktok"></i><span>TikTok</span></a></div>'
        };

        function showSectionByKey(key) {
            const mainContainer = document.querySelector('.main_div');
            if (data[key]) {
 
                mainContainer.animate([
                    { opacity: 1 },
                    { opacity: 0 }
                ], { duration: 150 }).onfinish = function() {
     
                    mainContainer.innerHTML = data[key];

                    mainContainer.animate([
                        { opacity: 0 },
                        { opacity: 1 }
                    ], { duration: 150 });
                };
            } else {
                mainContainer.innerHTML = '<div class="info"><p>Content not found</p></div>';
            }
        }

        document.getElementById('load-about').addEventListener('click', () => showSectionByKey('homepage'));
        document.getElementById('load-dj').addEventListener('click', () => showSectionByKey('diskJockey'));
        document.getElementById('load-prod').addEventListener('click', () => showSectionByKey('musicProduction'));

        document.getElementById('link-djlorek')?.addEventListener('click', () => {
            showSectionByKey('links');
        });

        document.getElementById('load-privacy').addEventListener('click', () => {
            window.open('PrivacyandPolicy.pdf', '_blank');
        });
    </script>
