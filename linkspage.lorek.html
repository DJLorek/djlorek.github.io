<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Lorek - Official Links</title>
    <link rel="stylesheet" href="homepage.lorek.css">
    
    <!-- Libreria per le icone (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-family: 'Aventa', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .link-btn i {
            font-size: 1.3rem;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .link-btn.primary-btn {
            background: rgb(92, 0, 0);
            border-color: rgb(150, 0, 0);
            box-shadow: 0 0 15px rgba(150, 0, 0, 0.4);
        }

        .link-btn.primary-btn:hover {
            background: rgb(130, 0, 0);
            border-color: rgb(220, 0, 0);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }

        .main_div_links {
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <div class="bg" aria-hidden="true">
        <div class="blob b1"><img src="./media/light.png" alt=""></div>
        <div class="blob b2"><img src="./media/light.png" alt=""></div>
        <div class="blob b3"><img src="./media/light.png" alt=""></div>
        <div class="blob b4"><img src="./media/light.png" alt=""></div>
        <div class="blob b5"><img src="./media/light.png" alt=""></div>
    </div>

    <header class="nav_bar">
        <img src="./media/djlorek.jpg" class="image" id="link-djlorek" alt="DJ Lorek">
        <span class="bar-separator">|</span>
        <h2>DJ LOREK</h2>
        <a href="mailto:officialdjlorek@gmail.com?subject=Gig%20Inquiry" class="button">Book Now!</a>
    </header>

    <section class="hero"> 
        <h4>DJ LOREK</h4>
    </section>

    <nav class="nav_2">
        <span id="load-about" class="menu-item about_menu">About</span>
        <span class="bar">|</span>
        <span id="load-dj" class="menu-item dj_menu">DJ</span>
        <span class="bar">|</span>
        <span id="load-prod" class="menu-item prod_menu">Music Production</span>
        <span class="bar">|</span>
        <span id="load-privacy" class="menu-item privacy_menu">Privacy</span>
    </nav>

    <main class="main_div main_div_links">
        <h5 class="about_title">Official Links</h5>
        <div class="links-list">
            <a href="mailto:officialdjlorek@gmail.com?subject=Gig%20Inquiry" class="link-btn primary-btn">
                <i class="fa-solid fa-envelope"></i>
                <span>Book Now! / Gig Inquiry</span>
            </a>
            <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-spotify"></i>
                <span>Spotify</span>
            </a>
            <a href="https://soundcloud.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-soundcloud"></i>
                <span>SoundCloud</span>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </a>
        </div>
    </main>

    <script>
        const overlay = document.getElementById('transitionOverlay');

        window.addEventListener('DOMContentLoaded', () => {
            const savedScroll = sessionStorage.getItem('scrollPos');
            if (savedScroll !== null) {
                window.scrollTo(0, parseInt(savedScroll, 10));
                sessionStorage.removeItem('scrollPos');
            }
            requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('reveal')));
        });

        function navigateTo(url) {
            sessionStorage.setItem('scrollPos', window.scrollY);
            overlay.classList.remove('reveal');
            overlay.addEventListener('transitionend', () => {
                window.location.href = url;
            }, { once: true });
        }

        document.getElementById('link-djlorek')?.addEventListener('click', () => {
            window.open('https://linktr.ee/djlorek', '_blank');
        });

        document.getElementById('load-about').addEventListener('click', () => navigateTo('index.html'));
        document.getElementById('load-dj').addEventListener('click', () => navigateTo('homepage.lorek.dj.html'));
        document.getElementById('load-prod').addEventListener('click', () => navigateTo('homepage.lorek.production.html'));
        document.getElementById('load-privacy').addEventListener('click', () => window.open('PrivacyandPolicy.pdf', '_blank'));
    </script>
</body>
</html>
